<!doctype html>
<meta charset="utf-8">
<title>HTML partial updates: activeTemplateAttributes of mutation records</title>
<link rel="help" href="https://dom.spec.whatwg.org/#dom-mutationrecord-activetemplateattributes">
<link rel="help" href="https://html.spec.whatwg.org/multipage/parsing.html#current-active-template">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/mutation-records.js"></script>
<div id="target"><?marker name="one"><?marker name="two"></div>
<script>
  const target = document.getElementById("target");
  const getRecords = collectRecords(target, {
    childList: true,
    activeTemplateAttributeFilter: ["for", "data-x", "data-missing", "DATA-Y"],
  });
  const getEmptyFilterRecords = collectRecords(target, {
    childList: true,
    activeTemplateAttributeFilter: [],
  });
</script>
<template for="one" data-x="1" data-y="2" data-z="3"><b>1</b><i>2</i></template>
<template for="two" data-x="other"><u>3</u></template>
<script>
  function attributesPerTemplate(records) {
    assert_array_equals(records.map(r => r.activeTemplateStatus),
      ["start", "update", "update", "end", "start", "update", "end"]);
    return [records.slice(0, 4), records.slice(4)].map(group => {
      const attributes = group[0].activeTemplateAttributes;
      for (const record of group) {
        assert_equals(record.activeTemplateAttributes, attributes,
          "all records for one template return the same object");
      }
      return attributes;
    });
  }

  test(() => {
    const [one, two] = attributesPerTemplate(getRecords());
    assert_not_equals(one, two);
    assert_equals(Object.getPrototypeOf(one), null);
    assert_true(Object.isFrozen(one));
    assert_array_equals(Object.keys(one), ["for", "data-x"]);
    assert_equals(one["for"], "one");
    assert_equals(one["data-x"], "1");
    assert_array_equals(Object.keys(two), ["for", "data-x"]);
    assert_equals(two["for"], "two");
    assert_equals(two["data-x"], "other");
  }, "activeTemplateAttributes is a frozen object with a null prototype that holds the listed attributes");

  test(() => {
    const [one, two] = attributesPerTemplate(getEmptyFilterRecords());
    const [otherObserverOne] = attributesPerTemplate(getRecords());
    assert_not_equals(one, two);
    assert_not_equals(one, otherObserverOne, "each observer gets its own object");
    assert_equals(Object.getPrototypeOf(one), null);
    assert_true(Object.isFrozen(one));
    assert_array_equals(Object.keys(one), []);
  }, "An empty activeTemplateAttributeFilter results in an empty object");

  test(() => {
    const map = new WeakMap();
    for (const record of getRecords()) {
      const attributes = record.activeTemplateAttributes;
      if (!map.has(attributes)) {
        map.set(attributes, []);
      }
      map.get(attributes).push(record.activeTemplateStatus);
    }
    const [one, two] = attributesPerTemplate(getRecords());
    assert_array_equals(map.get(one), ["start", "update", "update", "end"]);
    assert_array_equals(map.get(two), ["start", "update", "end"]);
  }, "activeTemplateAttributes can be used as a WeakMap key to group records");
</script>
