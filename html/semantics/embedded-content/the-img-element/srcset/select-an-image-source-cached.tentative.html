<!doctype html>
<title>img select an image source: optional preference for already-available higher-density image</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/images.html#select-an-image-source-from-a-source-set">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script>
const dpr = window.devicePixelRatio;
const DATA_GIF = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
let nextId = 0;

function imageUrl(label) {
  return new URL(`/images/green-1x1.png?${label}-${++nextId}`, location.href).href;
}

async function loadImg(t, attrs) {
  const img = document.createElement("img");
  t.add_cleanup(() => img.remove());
  const loaded = new Promise((resolve, reject) => {
    img.addEventListener("load", resolve, { once: true });
    img.addEventListener("error", () => reject(new Error("img load error")), { once: true });
  });
  for (const [name, value] of Object.entries(attrs)) {
    img.setAttribute(name, value);
  }
  document.body.appendChild(img);
  await loaded;
  return img;
}

promise_test(async t => {
  const uncachedMatch = imageUrl("uncached-1x");
  const cachedHigh = imageUrl("cached-2x");

  await loadImg(t, { src: cachedHigh });

  const img = await loadImg(t, {
    srcset: `${uncachedMatch} ${1 * dpr}x, ${cachedHigh} ${2 * dpr}x`,
  });
  assert_equals(img.currentSrc, cachedHigh);
  assert_equals(performance.getEntriesByName(uncachedMatch).length, 0);
}, "prefers already-loaded higher-density candidate over uncached DPR-matching candidate");

promise_test(async t => {
  const uncachedMatch = imageUrl("uncached-1x-multi");
  const cachedMid = imageUrl("cached-2x-multi");
  const uncachedTop = imageUrl("uncached-3x-multi");

  await loadImg(t, { src: cachedMid });

  const img = await loadImg(t, {
    srcset: `${uncachedMatch} ${1 * dpr}x, ${cachedMid} ${2 * dpr}x, ${uncachedTop} ${3 * dpr}x`,
  });
  assert_equals(img.currentSrc, cachedMid);
  assert_equals(performance.getEntriesByName(uncachedMatch).length, 0);
  assert_equals(performance.getEntriesByName(uncachedTop).length, 0);
}, "prefers already-loaded higher-density candidate without fetching even higher uncached candidate");

promise_test(async t => {
  const uncachedMatch = imageUrl("uncached-1x-data");
  const img = await loadImg(t, {
    srcset: `${uncachedMatch} ${1 * dpr}x, ${DATA_GIF} ${2 * dpr}x`,
  });
  assert_equals(img.currentSrc, DATA_GIF);
  assert_equals(performance.getEntriesByName(uncachedMatch).length, 0);
}, "prefers higher-density data: URL candidate over uncached DPR-matching candidate");
</script>
