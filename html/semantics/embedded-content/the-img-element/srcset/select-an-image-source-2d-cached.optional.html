<!doctype html>
<meta charset="utf-8">
<title>img select an image source with 2D sizes: optional preference for already-available higher-density image and zoom re-selection</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/images.html#select-an-image-source-from-a-source-set">
<link rel="help" href="https://html.spec.whatwg.org/multipage/images.html#normalise-the-source-densities">
<link rel="help" href="https://html.spec.whatwg.org/multipage/images.html#reacting-to-environment-changes">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script>
const dpr = window.devicePixelRatio;
const dataGif = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
let nextId = 0;

function imageUrl(label) {
  return new URL(`/images/green-2x2.png?${label}-${++nextId}`, location.href).href;
}

// Returns `${w}w ${h}h` with exact aspect ratio `aspectW : aspectH` such that on a box
// with concreteWidth = `unitCount * aspectW`, the normalized density is `u / unitCount`.
function pair(mult, aspectW, aspectH, unitCount, ratio = dpr) {
  const u = mult >= 1
    ? Math.ceil(unitCount * mult * ratio)
    : Math.max(1, Math.floor(unitCount * mult * ratio));
  return `${u * aspectW}w ${u * aspectH}h`;
}

async function loadImg(t, attrs) {
  const img = document.createElement("img");
  t.add_cleanup(() => img.remove());
  const loaded = new Promise((resolve, reject) => {
    img.addEventListener("load", resolve, { once: true });
    img.addEventListener("error", () => reject(new Error("img load error")), { once: true });
  });
  for (const [name, value] of Object.entries(attrs)) {
    img.setAttribute(name, value);
  }
  document.body.appendChild(img);
  await loaded;
  return img;
}

promise_test(async t => {
  const uncached1x = imageUrl("2d-uncached-1x");
  const cached2x = imageUrl("2d-cached-2x");

  await loadImg(t, { src: cached2x });

  // cover 400px 400px with 3:2 aspect ratio has concreteWidth = 600px = 200 * 3.
  const img = await loadImg(t, {
    sizes: "cover 400px 400px",
    srcset: `${uncached1x} ${pair(1, 3, 2, 200)}, ${cached2x} ${pair(2, 3, 2, 200)}`,
  });
  assert_equals(img.currentSrc, cached2x);
  assert_equals(performance.getEntriesByName(uncached1x).length, 0);
}, "2D sizes with h descriptors: prefers already-loaded higher-density candidate over uncached DPR-matching candidate");

promise_test(async t => {
  const uncached1x = imageUrl("2d-data-uncached-1x");

  const img = await loadImg(t, {
    sizes: "contain 800px 400px",
    srcset: `${uncached1x} ${pair(1, 1, 1, 400)}, ${dataGif} ${pair(2, 1, 1, 400)}`,
  });
  assert_equals(img.currentSrc, dataGif);
  assert_equals(performance.getEntriesByName(uncached1x).length, 0);
}, "2D sizes with h descriptors: prefers higher-density data: URL candidate over uncached DPR-matching candidate");

promise_test(async t => {
  const uncached1x = imageUrl("2d-pic-uncached-1x");
  const cached2x = imageUrl("2d-pic-cached-2x");
  const uncachedFallback = imageUrl("2d-pic-fallback");

  await loadImg(t, { src: cached2x });

  const picture = document.createElement("picture");
  t.add_cleanup(() => picture.remove());
  const source = document.createElement("source");
  source.sizes = "cover 400px 400px";
  source.srcset = `${uncached1x} ${pair(1, 3, 2, 200)}, ${cached2x} ${pair(2, 3, 2, 200)}`;
  const img = document.createElement("img");
  const loaded = new Promise((resolve, reject) => {
    img.addEventListener("load", resolve, { once: true });
    img.addEventListener("error", () => reject(new Error("picture img error")), { once: true });
  });
  img.src = uncachedFallback;
  picture.append(source, img);
  document.body.appendChild(picture);
  await loaded;

  assert_equals(img.currentSrc, cached2x);
  assert_equals(performance.getEntriesByName(uncached1x).length, 0);
  assert_equals(performance.getEntriesByName(uncachedFallback).length, 0);
}, "picture with 2D sizes: prefers already-loaded higher-density source candidate over uncached DPR-matching candidate");

promise_test(async t => {
  const uncached1x = imageUrl("2d-preload-uncached-1x");
  const preloaded2x = imageUrl("2d-preloaded-2x");

  const link = document.createElement("link");
  t.add_cleanup(() => link.remove());
  assert_implements(link.relList && link.relList.supports("preload"), "preload not supported");
  link.rel = "preload";
  link.as = "image";
  // Preload at cover 400px 400px where concreteWidth = 800px (2:1 aspect ratio) selects preloaded2x.
  link.imageSizes = "cover 400px 400px";
  link.imageSrcset = `${uncached1x} ${pair(0.5, 2, 1, 400)}, ${preloaded2x} ${pair(1, 2, 1, 400)}`;
  const linkLoaded = new Promise((resolve, reject) => {
    link.addEventListener("load", resolve, { once: true });
    link.addEventListener("error", () => reject(new Error("preload error")), { once: true });
  });
  document.head.appendChild(link);
  await linkLoaded;

  // On contain 400px 400px, concreteWidth halves to 400px, so uncached1x is 1*dpr and preloaded2x is 2*dpr.
  const img = await loadImg(t, {
    sizes: "contain 400px 400px",
    srcset: `${uncached1x} ${pair(0.5, 2, 1, 400)}, ${preloaded2x} ${pair(1, 2, 1, 400)}`,
  });
  assert_equals(img.currentSrc, preloaded2x);
  assert_equals(performance.getEntriesByName(uncached1x).length, 0);
}, "prefers higher-density 2D candidate preloaded via <link rel=preload imagesizes imagesrcset>");

promise_test(async t => {
  const uncachedSmall = imageUrl("2d-shrink-uncached");
  const loadedLarge = imageUrl("2d-shrink-loaded");

  // With 2:1 aspect ratio on cover 400px 400px, concreteWidth = 800px, so loadedLarge (1x*dpr) is selected.
  const img = await loadImg(t, {
    sizes: "cover 400px 400px",
    srcset: `${uncachedSmall} ${pair(0.5, 2, 1, 400)}, ${loadedLarge} ${pair(1, 2, 1, 400)}`,
  });
  assert_equals(img.currentSrc, loadedLarge);
  assert_equals(performance.getEntriesByName(uncachedSmall).length, 0);

  // Switching from cover to contain halves concreteWidth to 400px, making uncachedSmall 1x*dpr and loadedLarge 2x*dpr.
  img.sizes = "contain 400px 400px";
  await new Promise(resolve => t.step_timeout(resolve, 0));

  assert_true(img.complete);
  assert_equals(img.currentSrc, loadedLarge);
  assert_equals(performance.getEntriesByName(uncachedSmall).length, 0);
}, "keeps element's already-loaded wider 2D candidate when sizes fit changes from cover to contain");

promise_test(async t => {
  const u1 = imageUrl("2d-dyn-zoom-1x");
  const u2 = imageUrl("2d-dyn-zoom-2x");
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  document.body.appendChild(iframe);
  await new Promise(resolve => {
    iframe.addEventListener("load", resolve, { once: true });
    iframe.srcdoc = `<!doctype html>
      <img sizes="cover 400px 400px"
           srcset="${u1} ${pair(1, 3, 2, 200)}, ${u2} ${pair(2, 3, 2, 200)}">`;
  });
  const img = iframe.contentDocument.querySelector("img");
  assert_equals(img.currentSrc, u1);

  iframe.style.zoom = "2";
  iframe.offsetWidth;
  assert_equals(iframe.contentWindow.devicePixelRatio, 2 * dpr);
  await t.step_wait(() => img.currentSrc === u2, "img re-selected the 2x 2D candidate", 3000);
}, "dynamic zoom change on the iframe re-selects the 2D sizes + h descriptor image source");
</script>
