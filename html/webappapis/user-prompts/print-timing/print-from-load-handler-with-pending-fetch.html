<!DOCTYPE html>
<meta charset="utf-8">
<link rel="help" href="https://html.spec.whatwg.org/multipage/timers-and-user-prompts.html#dom-print">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<title>print() from the load event handler prints once the load event is done, even while a fetch is still loading</title>
<script>
async_test(t => {
  const stalledURL = new URL(`/common/blank.html?pipe=trickle(d5)&rand=${Math.random()}`, location.href).href;
  let loadHandlerReturned = false;
  addEventListener("beforeprint", t.step_func(() => {
    assert_true(loadHandlerReturned, "the load event handler has returned");
    assert_equals(performance.getEntriesByName(stalledURL).length, 0, "the stalled fetch has not finished");
  }));
  addEventListener("afterprint", t.step_func_done());
  onload = () => {
    fetch(stalledURL).catch(() => { });
    print();
    loadHandlerReturned = true;
  };
});
</script>
