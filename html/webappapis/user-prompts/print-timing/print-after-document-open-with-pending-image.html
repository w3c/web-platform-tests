<!DOCTYPE html>
<meta charset="utf-8">
<link rel="help" href="https://html.spec.whatwg.org/multipage/timers-and-user-prompts.html#dom-print">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<title>print() right after document.open(), write() and close() on a loaded document prints right away</title>
<body>
<iframe id="frame" src="about:blank"></iframe>
<script>
async_test(t => {
  const stalledImageURL = new URL(`/images/green.png?pipe=trickle(d2)&rand=${Math.random()}`, location.href).href;
  onload = () => t.step_timeout(() => {
    const frameWindow = document.getElementById("frame").contentWindow;
    const frameDocument = frameWindow.document;
    frameDocument.open();
    frameDocument.write(`<img src="${stalledImageURL}">`);
    frameDocument.close();
    frameWindow.addEventListener("afterprint", t.step_func_done(() => {
      assert_equals(frameWindow.performance.getEntriesByName(stalledImageURL).length, 0, "the written image has not finished loading");
    }));
    frameWindow.print();
  }, 0);
});
</script>
</body>
