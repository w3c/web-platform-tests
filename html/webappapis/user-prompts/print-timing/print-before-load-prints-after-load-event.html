<!DOCTYPE html>
<meta charset="utf-8">
<link rel="help" href="https://html.spec.whatwg.org/multipage/timers-and-user-prompts.html#dom-print">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<title>print() while the page is still loading prints after the load event, even when only an iframe is still loading</title>
<body>
<script>
async_test(t => {
  // The load event waits for the iframe. The shorter fetch makes sure print() is deferred.
  document.write(`<iframe src="/common/blank.html?pipe=trickle(d1)&rand=${Math.random()}"></iframe>`);
  fetch(`/common/blank.html?pipe=trickle(d0.3)&rand=${Math.random()}`).catch(() => { });
  let loadEventFired = false;
  addEventListener("load", () => { loadEventFired = true; });
  addEventListener("beforeprint", t.step_func(() => {
    assert_true(loadEventFired, "the load event has fired");
  }));
  addEventListener("afterprint", t.step_func_done());
  print();
});
</script>
</body>
