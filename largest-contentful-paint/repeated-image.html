<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: repeated image.</title>
<style>
  #image_id {
    width: 10px;
    height: 10px;
  }
</style>
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<script>
  setup({"hide_test_state": true});
  assert_implements(window.LargestContentfulPaint,
                    "LargestContentfulPaint is not implemented");
  const url = window.location.origin + '/images/black-rectangle.png';
  const beforeLoad = performance.now();
  let secondBeforeLoad = 0;
  const entriesPromise = observeLCP({url}, {count: 2});
  // The first image is shrunk to be 10 x 10. The second image is added at its
  // natural size: 100 x 50.
  promise_test(async () => {
    const entries = await entriesPromise;
    const size = 10 * 10;
    checkImage(entries[0], url, 'image_id', size, beforeLoad);
  }, 'First image');
  promise_test(async () => {
    const entries = await entriesPromise;
    const size = 100 * 50;
    checkImage(entries[1], url, 'second_id', size, () => secondBeforeLoad);
  }, 'Second image');
  observeLCP({url}).then(() => {
    secondBeforeLoad = performance.now();
    appendImage('/images/black-rectangle.png',
                {id: 'second_id', container: document.getElementById('image_div')});
  });
</script>
<img src='/images/black-rectangle.png' id='image_id'/>
<div id='image_div'></div>
</body>
