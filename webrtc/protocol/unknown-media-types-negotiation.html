<!doctype html>
<meta charset=utf-8>
<title>RTCPeerConnection negotiation of unknown media types</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
'use strict';

// An unknown media type can name a protocol which has to be reproduced along
// with the rest of the m= line.
// This is a real RFC 7850 protocol, just not one we normally offer.
// https://www.rfc-editor.org/rfc/rfc7850.html
const kUnknownTypeProtocol = 'TCP/DTLS/RTP/SAVPF';

// Negotiates a session whose only m= section has a media type that neither
// endpoint knows, which the answerer must reject by setting the port to zero
// ([RFC9429] section 5.3.1). Rejected m= sections are reproduced in subsequent
// offers, so the answerer ends up offering a media type it does not itself
// understand.
//
// Returns that answerer, with the re-offer applied as its local description,
// along with an answer to the re-offer generated by a third endpoint.
async function offerRejectedUnknownMediaType(t) {
  const offerer = new RTCPeerConnection();
  const answerer = new RTCPeerConnection();
  const reanswerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  t.add_cleanup(() => answerer.close());
  t.add_cleanup(() => reanswerer.close());

  offerer.addTransceiver('audio');
  const offer = await offerer.createOffer();
  await answerer.setRemoteDescription({
    type: 'offer',
    sdp: offer.sdp.replace(/^m=audio (\d+) \S+/m,
                           `m=unicorns $1 ${kUnknownTypeProtocol}`)
  });
  await answerer.setLocalDescription(await answerer.createAnswer());

  assert_equals(answerer.getTransceivers().length, 0,
                'a rejected unknown m= section gets no transceiver');

  const reoffer = await answerer.createOffer();
  assert_true(reoffer.sdp.includes(`m=unicorns 0 ${kUnknownTypeProtocol} `),
              'the re-offer includes the rejected m= section and its protocol');
  await answerer.setLocalDescription(reoffer);
  await reanswerer.setRemoteDescription(reoffer);

  return [answerer, await reanswerer.createAnswer()];
}

// [RFC9429] section 5.8.3 requires the media type of every m= section in an
// answer to exactly match the media type of the corresponding m= section in
// the offer, and says nothing that would exempt media types the endpoints do
// not recognize. One unknown media type therefore cannot stand in for another.
promise_test(async t => {
  // Control: the answer is accepted while the media type is left alone, so a
  // rejection below can only be caused by the changed media type.
  const [control, controlAnswer] = await offerRejectedUnknownMediaType(t);
  await control.setRemoteDescription(controlAnswer);

  const [pc, answer] = await offerRejectedUnknownMediaType(t);
  await promise_rejects_dom(t, 'InvalidAccessError', pc.setRemoteDescription({
    type: 'answer',
    sdp: answer.sdp.replace('m=unicorns ', 'm=dragons ')
  }));
}, 'An answer may not substitute one unknown media type for another');

// [RFC9429] section 5.2.1 generates "a=mid" lines as specified in [RFC5888]
// section 4, which requires the value to be unique within the session
// description, and section 5.2.2 requires an m= section that is recycled to be
// given a new MID value. An m= section that was rejected because its media type
// was unknown is still using its MID, so that value is not available for
// another m= section.
promise_test(async t => {
  const offerer = new RTCPeerConnection();
  const answerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  t.add_cleanup(() => answerer.close());

  offerer.addTransceiver('audio');
  offerer.addTransceiver('video');
  const offer = await offerer.createOffer();
  await answerer.setRemoteDescription({
    type: 'offer',
    sdp: offer.sdp.replace('m=video ', 'm=unicorns ')
  });

  const answer = await answerer.createAnswer();
  assert_true(answer.sdp.includes('m=unicorns 0 '),
              'the unknown media type is rejected in the answer');
  await answerer.setLocalDescription(answer);

  // This needs an m= section that the rejected one cannot supply, either by
  // recycling the rejected section or by adding another one.
  answerer.addTransceiver('audio');
  const reoffer = await answerer.createOffer();

  const mids = [...reoffer.sdp.matchAll(/^a=mid:(\S*)/gm)].map(([, mid]) => mid);
  assert_equals(new Set(mids).size, mids.length,
                `each m= section needs its own mid, got ${mids.join(', ')}`);
}, 'A mid used by a rejected unknown m= section is not given to another m= section');
</script>
