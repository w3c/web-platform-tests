<!DOCTYPE html>
<meta charset="utf-8">
<title>unused @font-face blocks load via link</title>
<link rel=help href="https://github.com/w3c/csswg-drafts/issues/1088">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
let linkLoadTime;
</script>
<link rel=stylesheet href="support/font-face-unused.css" onload="linkLoadTime = performance.now()">
<script>
const t1 = performance.getEntriesByType("navigation")[0].responseStart;

async_test(function(t) {
  window.addEventListener("load", t.step_func_done(function() {
    const diff = performance.now() - t1;
    assert_less_than(diff, 1000, "ms after style");
  }));
}, "document load doesn't wait for unused @font-face (via link)");

async_test(function(t) {
  window.addEventListener("load", t.step_func_done(function() {
    assert_less_than(linkLoadTime - t1, 1000, "ms after style");
  }));
}, "link load event doesn't wait for unused @font-face");
</script>
