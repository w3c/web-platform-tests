<!DOCTYPE html>
<meta charset="utf-8">
<title>@import blocks load via link</title>
<link rel=help href="https://github.com/w3c/csswg-drafts/issues/1088">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
let linkLoadTime;
</script>
<link rel=stylesheet href="support/import-outer.css" onload="linkLoadTime = performance.now()">
<div id=foo>XXX</div>
<script>
const t1 = performance.getEntriesByType("navigation")[0].responseStart;

async_test(function(t) {
  window.addEventListener("load", t.step_func_done(function() {
    const diff = performance.now() - t1;
    assert_greater_than(diff, 1000, "ms after style");
    const style = getComputedStyle(document.querySelector("#foo"));
    assert_equals(style.getPropertyValue("color"), "rgb(0, 0, 255)", "#foo.color");
  }));
}, "document load waits for @import (via link)");

async_test(function(t) {
  window.addEventListener("load", t.step_func_done(function() {
    assert_greater_than(linkLoadTime - t1, 1000, "ms after style");
  }));
}, "link load event waits for @import");
</script>
