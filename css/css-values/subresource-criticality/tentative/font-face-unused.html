<!DOCTYPE html>
<meta charset="utf-8">
<title>unused @font-face blocks load</title>
<link rel=help href="https://github.com/w3c/csswg-drafts/issues/1088">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
@font-face {
  font-family: Revalia;
  src: url("/fonts/Revalia.woff?pipe=trickle(d1)");
}
</style>
<script>
const t1 = performance.getEntriesByType("navigation")[0].responseStart;

async_test(function(t) {
  window.addEventListener("load", t.step_func_done(function() {
    const t2 = performance.now();
    const diff = t2 - t1;
    assert_less_than(diff, 1000, "ms after style");
  }));
}, "load doesn't wait for unused @font-face");

async_test(function(t) {
  document.documentElement.offsetWidth;
  document.fonts.ready.then(t.step_func_done(function() {
    const t2 = performance.now();
    const diff = t2 - t1;
    assert_less_than(diff, 1000, "ms after style");
  }));
}, "document.fonts.ready doesn't wait for unused @font-face");
</script>
