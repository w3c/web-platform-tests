<!DOCTYPE html>
<meta charset="utf-8">
<title>used @font-face blocks load</title>
<link rel=help href="https://github.com/w3c/csswg-drafts/issues/1088">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
@font-face {
  font-family: Revalia;
  src: url("/fonts/Revalia.woff?pipe=trickle(d1)");
}
#foo {
  font: 25px/1 Revalia;
}
</style>
<div id=foo>XXX</div>
<script>
const t1 = performance.getEntriesByType("navigation")[0].responseStart;

async_test(function(t) {
  window.addEventListener("load", t.step_func_done(function() {
    const t2 = performance.now();
    const diff = t2 - t1;
    assert_greater_than(diff, 1000, "ms after style");
  }));
}, "load waits for used @font-face");

async_test(function(t) {
  // Layout uses the font, so this starts the load before reading document.fonts.ready.
  document.querySelector("#foo").offsetWidth;
  document.fonts.ready.then(t.step_func_done(function() {
    const t2 = performance.now();
    const diff = t2 - t1;
    assert_greater_than(diff, 1000, "ms after style");
  }));
}, "document.fonts.ready waits for used @font-face");

async_test(function(t) {
  const order = [];
  document.querySelector("#foo").offsetWidth;
  const ready = document.fonts.ready.then(() => order.push("ready"));
  const loaded = new Promise(resolve => {
    window.addEventListener("load", () => {
      order.push("load");
      resolve();
    });
  });
  Promise.all([ready, loaded]).then(t.step_func_done(() => {
    assert_array_equals(order, ["load", "ready"]);
  }));
}, "document.fonts.ready resolves after the load event");
</script>
